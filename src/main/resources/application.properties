spring.application.name=sgat-oit
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgat_oit}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo crea el script SQL, JPA no debe modificarlo
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# Si se define, activa la cuenta admin@cultura.gob.pe con esa contrasena
sgat.bootstrap.admin-password=${ADMIN_PASSWORD}
# Si es true, crea usuarios de prueba (solicitante y tecnico) con la misma contrasena
sgat.bootstrap.demo-users=true
