spring.application.name=sgat-oit
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgat_oit}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea el script SQL, JPA no debe modificarlo
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET:cambiar-este-secreto-por-uno-de-al-menos-32-caracteres}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}

# Si se define, activa la cuenta admin@cultura.gob.pe con esa contrasena
sgat.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Si es true, crea usuarios de prueba (solicitante y tecnico) con la misma contrasena
sgat.bootstrap.demo-users=${BOOTSTRAP_DEMO_USERS:false}
