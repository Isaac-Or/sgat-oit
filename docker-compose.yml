services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sgat_oit
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgat_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Todo archivo .sql dentro de ./db se ejecuta la primera vez que se crea la base
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d sgat_oit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sgat_oit
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-sgat_secret}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-un-secreto-largo-de-al-menos-32-caracteres}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_DEMO_USERS: ${BOOTSTRAP_DEMO_USERS:-false}
    ports:
      - "8080:8080"

volumes:
  pgdata:
